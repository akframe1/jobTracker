<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #2d3a8c;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input, select {
      flex: 1;
      min-width: 160px;
      padding: 0.6rem 0.9rem;
      border: 1px solid #dde1ef;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button.add-btn {
      padding: 0.6rem 1.4rem;
      background: #2d3a8c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button.add-btn:hover { background: #1e2a6e; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th {
      text-align: left;
      padding: 0.6rem 1rem;
      background: #f0f2fc;
      color: #2d3a8c;
      font-weight: 600;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #eef0f7;
    }

    tr:last-child td { border-bottom: none; }

    .status {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .status-Applied    { background: #e8f4fd; color: #1a78c2; }
    .status-Interview  { background: #fff3cd; color: #856404; }
    .status-Offer      { background: #d4edda; color: #155724; }
    .status-Rejected   { background: #f8d7da; color: #721c24; }

    .delete-btn {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .delete-btn:hover { color: #922b21; }

    #empty-msg {
      text-align: center;
      color: #999;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <h1>📋 Job Application Tracker</h1>

  <!-- Add Form -->
  <div class="card">
    <div class="form-row">
      <input type="text" id="company" placeholder="Company (e.g. Acme Corp)" />
      <input type="text" id="role"    placeholder="Role (e.g. Software Engineer)" />
      <select id="status">
        <option>Applied</option>
        <option>Interview</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>
      <button class="add-btn" onclick="addApplication()">+ Add</button>
    </div>
  </div>

  <!-- Applications Table -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Role</th>
          <th>Status</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="app-list">
        <tr><td colspan="5" id="empty-msg">No applications yet. Add one above.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API = '/applications';

    // Load all applications on page load
    async function loadApplications() {
      const res = await fetch(API);
      const data = await res.json();
      renderTable(data);
    }

    // Add a new application
    async function addApplication() {
      const company = document.getElementById('company').value.trim();
      const role    = document.getElementById('role').value.trim();
      const status  = document.getElementById('status').value;

      if (!company || !role) {
        alert('Please fill in both Company and Role.');
        return;
      }

      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company, role, status })
      });

      document.getElementById('company').value = '';
      document.getElementById('role').value = '';
      loadApplications();
    }

    // Delete an application
    async function deleteApplication(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadApplications();
    }

    // Render the table from data
    function renderTable(applications) {
      const tbody = document.getElementById('app-list');

      if (applications.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" id="empty-msg">No applications yet. Add one above.</td></tr>';
        return;
      }

      tbody.innerHTML = applications.map(a => `
        <tr>
          <td>${escape(a.company)}</td>
          <td>${escape(a.role)}</td>
          <td><span class="status status-${a.status}">${a.status}</span></td>
          <td>${new Date(a.createdAt).toLocaleDateString()}</td>
          <td><button class="delete-btn" onclick="deleteApplication(${a.id})">🗑</button></td>
        </tr>
      `).join('');
    }

    // Basic XSS protection
    function escape(str) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    loadApplications();
  </script>

</body>
</html>
