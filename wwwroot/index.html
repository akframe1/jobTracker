<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
</head>
<body>

  <h1>📋 Job Application Tracker</h1>

  <!-- Add Form -->
  <div class="card">
    <div class="form-row">
      <input type="text" id="company" placeholder="Company (e.g. Acme Corp)" />
      <input type="text" id="role"    placeholder="Role (e.g. Software Engineer)" />
      <select id="status">
        <option>Applied</option>
        <option>Interview</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>
      <button class="add-btn" onclick="addApplication()">+ Add</button>
    </div>
  </div>

  <!-- Applications Table -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Role</th>
          <th>Status</th>
          <th>Date</th>
          <th></th>  <!-- edit -->
          <th></th>  <!-- delete -->
        </tr>
      </thead>
      <tbody id="app-list">
        <tr><td colspan="5" id="empty-msg">No applications yet. Add one above.</td></tr>
      </tbody>
    </table>
  </div>

<!-- Edit Modal -->
<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">  <div class="card" style="width:400px; margin:0;">
    <h3 style="margin-bottom:1rem; color:#2d3a8c;">Edit Application</h3>
    <input type="hidden" id="edit-id" />
    <div style="display:flex; flex-direction:column; gap:0.75rem;">
      <input type="text" id="edit-company" placeholder="Company" />
      <input type="text" id="edit-role" placeholder="Role" />
      <select id="edit-status">
        <option>Applied</option>
        <option>Interview</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <button onclick="closeModal()" style="padding:0.6rem 1.2rem; border:1px solid #dde1ef; border-radius:6px; cursor:pointer; background:white;">Cancel</button>
        <button onclick="saveEdit()" class="add-btn">Save</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
