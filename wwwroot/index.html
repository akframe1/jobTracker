<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>📋 Job Application Tracker</h1>

  <!-- Add Form -->
  <div class="card">
    <div class="form-row">
      <input type="text" id="company" placeholder="Company (e.g. Acme Corp)" />
      <input type="text" id="role" placeholder="Role (e.g. Software Engineer)" />
      <select id="status">
        <option>Applied</option>
        <option>Interview</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>
      <button class="add-btn" onclick="addApplication()">+ Add</button>
    </div>
  </div>

  <!-- Applications Table -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Role</th>
          <th>Status</th>
          <th>Date</th>
          <th></th> 
          <th></th>
        </tr>
      </thead>
      <tbody id="app-list">
        <tr><td colspan="6" id="empty-msg">No applications yet. Add one above.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div id="modal" class="modal-overlay">
    <div class="card modal-card">
      <h3 class="modal-title">Edit Application</h3>
      <input type="hidden" id="edit-id" />
      <div class="modal-fields">
        <input type="text" id="edit-company" placeholder="Company" />
        <input type="text" id="edit-role" placeholder="Role" />
        <select id="edit-status">
          <option>Applied</option>
          <option>Interview</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
        <div class="modal-actions">
          <button onclick="closeModal()" class="cancel-btn">Cancel</button>
          <button onclick="saveEdit()" class="add-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
